name: DEPLOY-develop
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0} <- {1}', github.event.inputs['target-environment'] || 'auto', github.event.inputs['build-run-name'] || format('latest from {0}', github.ref_name)) || format('Deploy auto <- run {0}', github.run_id) }}

# Stage-per-environment deployment workflow (generated by setup-github.ps1).
#
# To add another environment later:
#   1. Add it to workflow_dispatch target-environment options.
#   2. Add a deploy-* job and chain needs to the previous stage.
#   3. Set previous-environment-name to the previous stage short name.
#   4. In environment-approval mode, keep the repository_dispatch trigger enabled.

permissions:
  actions: read
  contents: write
  id-token: write

on:
  repository_dispatch:
    types: ['alm4dataverse-build-deploy-develop']
  workflow_dispatch:
    inputs:
      build-run-name:
        description: 'Optional exact BUILD name to deploy. Leave blank to use the latest successful BUILD from this branch. Numeric run IDs also work.'
        required: false
        type: string
      target-environment:
        description: 'Optional target environment. Leave blank to start from the first configured stage. Valid values: test.'
        required: false
        type: string

jobs:
  deploy-test:
    # First stage in the chain.
    if: >-
      (
        github.event_name == 'repository_dispatch' &&
        'environment-approval' == 'environment-approval' &&
        github.event.client_payload.branch == 'develop'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.target-environment == 'test' ||
          ('environment-approval' == 'environment-approval' && inputs.target-environment == '')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: 'test'
    concurrency:
      group: alm4dataverse-environment-test
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Deploy to test
        uses: robwood-TTECDigital/Dataverse-ALM-Test4-Shared/.github/actions/deploy@main
        with:
          environment-name: 'test'
          previous-environment-name: ''
          promotion-mode: environment-approval
          trigger-branch: 'develop'
          github-context-json: ${{ toJSON(github) }}
          caller-inputs-json: ${{ toJSON(inputs) }}
          vars-json: ${{ toJSON(vars) }}
          # Add any custom secrets explicitly to this JSON object.
          secrets-json: >-
            {
              "AZURE_CLIENT_SECRET": ${{ toJSON(secrets.AZURE_CLIENT_SECRET) }}
            }
